<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elnor Yapı Asistanı</title>
    <style>
        /* Sitenin genel görünümü ve dış cephe boyası */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { background: white; width: 400px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 500px; }
        .chat-header { background: #2c3e50; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .user-msg { background: #3498db; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .ai-msg { background: #e0e0e0; color: #333; align-self: flex-start; border-bottom-left-radius: 0; }
        .input-area { display: flex; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 15px; border: none; outline: none; font-size: 14px; }
        .input-area button { padding: 15px 20px; background: #2ecc71; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .input-area button:hover { background: #27ae60; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Elnor Yapı Dijital Asistan</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Merhaba! Ben Elnor Yapı asistanıyım. Projelerimiz hakkında size nasıl yardımcı olabilirim?</div>
    </div>
    <div class="input-area">
        <!-- Kullanıcının mesaj yazdığı yer -->
        <input type="text" id="userInput" placeholder="Mesajınızı buraya yazın..." onkeypress="enterTusu(event)">
        <button onclick="mesajGonder()">Gönder</button>
    </div>
</div>

<script>
    // Arka plandaki yapay zeka motoruyla iletişim kuran sistem (JavaScript)
    async function mesajGonder() {
        const inputAlani = document.getElementById("userInput");
        const mesaj = inputAlani.value.trim();
        if (!mesaj) return;

        // Kullanıcının mesajını ekrana ekle
        mesajEkle(mesaj, "user-msg");
        inputAlani.value = ""; // Kutuyu temizle

        try {
            // Yazılan mesajı arka plandaki routes.py'ye (trafik polisine) yolla
            // YÖNERGEYE GÖRE GÜNCELLENDİ: /api/sohbet
            const response = await fetch('/api/sohbet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mesaj: mesaj })
            });
            
            const data = await response.json();
            if (data.cevap) {
                // Groq'tan gelen cevabı ekrana ekle
                mesajEkle(data.cevap, "ai-msg");
            }
        } catch (error) {
            mesajEkle("Sistemle bağlantı kurulamadı. Sunucunun açık olduğundan emin olun.", "ai-msg");
        }
    }

    function mesajEkle(metin, sinifAdi) {
        const chatKutusu = document.getElementById("chatBox");
        const yeniMesaj = document.createElement("div");
        yeniMesaj.className = "message " + sinifAdi;
        yeniMesaj.textContent = metin;
        chatKutusu.appendChild(yeniMesaj);
        chatKutusu.scrollTop = chatKutusu.scrollHeight; // Ekranı hep en alta kaydır
    }

    function enterTusu(event) {
        if (event.key === "Enter") {
            mesajGonder();
        }
    }
</script>

</body>
</html>
